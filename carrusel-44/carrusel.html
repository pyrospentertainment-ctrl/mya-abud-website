<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>XLIV · El libro sigue abierto</title>
<link href="fonts/fonts.css" rel="stylesheet">
<style>
  :root {
    --W: 1080px;
    --H: 1350px;
    --ink: #07060a;
    --ivory: #ece3d2;
    --ivory-dim: #b9ae9b;
    --gold-1: #7a5a26;
    --gold-2: #c9a45c;
    --gold-3: #f1dca2;
    --wine: #3a1424;
    --gold-grad: linear-gradient(100deg, #8c6a2e 0%, #e9d08f 28%, #b88d43 52%, #f6e4b0 74%, #9a7533 100%);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--ink); }
  body {
    width: calc(var(--W) * 10);
    height: var(--H);
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
    text-rendering: geometricPrecision;
  }

  /* ---------- Panorama: un solo lienzo continuo, cortado en 10 láminas ---------- */
  #pano {
    position: relative;
    width: calc(var(--W) * 10);
    height: var(--H);
    overflow: hidden;
    background:
      radial-gradient(ellipse 900px 1100px at 540px 620px, #2a1220 0%, transparent 70%),
      radial-gradient(ellipse 1300px 900px at 3240px 300px, #1f1019 0%, transparent 70%),
      radial-gradient(ellipse 1200px 1000px at 5400px 1100px, #24121d 0%, transparent 70%),
      radial-gradient(ellipse 1300px 900px at 7560px 250px, #1c0f18 0%, transparent 70%),
      radial-gradient(ellipse 1100px 1100px at 10260px 700px, #2c1421 0%, transparent 70%),
      linear-gradient(180deg, #0c0a10 0%, #07060a 55%, #0a080c 100%);
  }
  .layer { position: absolute; inset: 0; pointer-events: none; }
  #smoke { mix-blend-mode: screen; opacity: 1; }
  #grain { mix-blend-mode: overlay; opacity: .16; }

  /* ---------- Lámina ---------- */
  .slide {
    position: absolute;
    top: 0;
    width: var(--W);
    height: var(--H);
    padding: 0 96px;
  }
  .vignette {
    position: absolute; inset: 0;
    background: radial-gradient(ellipse 78% 70% at 50% 52%, transparent 55%, rgba(0,0,0,.55) 100%);
  }

  .hdr {
    position: absolute; top: 62px; left: 96px; right: 96px;
    display: flex; justify-content: space-between; align-items: center;
    font-family: 'Cinzel', serif; font-weight: 500;
    font-size: 19px; letter-spacing: .32em; color: var(--ivory-dim);
  }
  .hdr .l { display: flex; align-items: center; gap: 16px; }
  .hdr .r { display: flex; align-items: center; gap: 14px; }
  .hdr svg { display: block; }

  .head {
    position: absolute; top: 132px; left: 96px; right: 96px;
    text-align: center;
  }
  .numeral {
    font-family: 'Cinzel', serif; font-weight: 500;
    font-size: 124px; line-height: 1; letter-spacing: .08em; padding-left: .08em;
    background: var(--gold-grad);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 28px rgba(201,164,92,.28));
  }
  .orn { margin: 14px auto 10px; display: block; }
  .kicker {
    font-family: 'Cormorant Garamond', serif; font-style: italic; font-weight: 500;
    font-size: 40px; color: var(--gold-3); letter-spacing: .01em;
  }

  .body {
    position: absolute; left: 104px; right: 104px; top: 430px; bottom: 170px;
    display: flex; flex-direction: column; justify-content: center;
    font-family: 'Cormorant Garamond', serif; font-weight: 500;
    color: var(--ivory);
    font-size: 37px; line-height: 1.34;
    hyphens: auto; -webkit-hyphens: auto;
    text-align: left;
  }
  .body p + p { margin-top: .62em; }
  .body p:first-child::first-letter {
    font-family: 'Cinzel', serif; font-weight: 600;
    float: left; font-size: 3.15em; line-height: .86; margin: .06em .12em 0 0;
    color: var(--gold-2);
  }
  .body .punch {
    margin-top: 1em !important;
    text-align: center; text-align-last: center;
    font-style: italic; font-weight: 500;
    font-size: 1.22em; line-height: 1.26;
    color: var(--gold-3);
    hyphens: manual;
    text-wrap: balance;
  }
  .body .punch::before {
    content: ''; display: block; width: 64px; height: 1px; margin: 0 auto .7em;
    background: linear-gradient(90deg, transparent, var(--gold-2), transparent);
  }

  .ftr {
    position: absolute; left: 96px; right: 96px; bottom: 60px;
    display: flex; justify-content: space-between; align-items: center;
    font-family: 'Cinzel', serif; font-size: 18px; letter-spacing: .34em;
    color: var(--ivory-dim);
  }
  .ftr .swipe { display: flex; align-items: center; gap: 14px; color: var(--gold-2); }

  /* ---------- Portada ---------- */
  .cover .date {
    position: absolute; top: 150px; left: 0; right: 0; text-align: center;
    font-family: 'Cinzel', serif; font-size: 22px; letter-spacing: .5em; color: var(--gold-2);
  }
  .cover .sigil { position: absolute; left: 50%; top: 250px; transform: translateX(-50%); }
  .cover .big {
    position: absolute; top: 790px; left: 80px; right: 80px; text-align: center;
  }
  .cover .big h1 {
    font-family: 'Cormorant Garamond', serif; font-weight: 500; font-style: italic;
    font-size: 96px; line-height: 1; color: var(--ivory); letter-spacing: -.005em;
  }
  .cover .big h1 b {
    font-weight: 600; font-style: normal;
    background: var(--gold-grad); -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .cover .big .sub {
    margin: 34px auto 0; max-width: 820px; text-wrap: balance;
    font-family: 'Cormorant Garamond', serif; font-size: 34px; line-height: 1.32; color: var(--ivory-dim);
  }
  .cover .big .sub em { color: var(--gold-3); }
  .cover .names {
    position: absolute; bottom: 150px; left: 0; right: 0; text-align: center;
    font-family: 'Cinzel', serif; font-size: 17px; letter-spacing: .42em; color: var(--ivory-dim); opacity: .85;
  }

  /* ---------- Cierre ---------- */
  .close .wrap { position: absolute; top: 160px; left: 96px; right: 96px; text-align: center; }
  .close .eyebrow { font-family: 'Cinzel', serif; font-size: 22px; letter-spacing: .5em; color: var(--gold-2); }
  .close h2 {
    margin-top: 40px;
    font-family: 'Cormorant Garamond', serif; font-weight: 500; font-size: 64px; line-height: 1.12; color: var(--ivory);
  }
  .close h2 em { color: var(--gold-3); }
  .close .choice { margin: 56px auto 0; display: flex; justify-content: center; gap: 36px; }
  .close .pill {
    width: 400px; padding: 74px 20px 34px;
    border: 1px solid rgba(201,164,92,.55);
    border-radius: 200px 200px 18px 18px;
    background: linear-gradient(180deg, rgba(201,164,92,.10), rgba(201,164,92,.02));
  }
  .close .pill .w {
    font-family: 'Cinzel', serif; font-weight: 600; font-size: 38px; letter-spacing: .14em;
    background: var(--gold-grad); -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .close .pill .d { margin-top: 10px; font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 29px; color: var(--ivory-dim); line-height: 1.2; }
  .close .how { margin-top: 26px; font-family: 'Cormorant Garamond', serif; font-size: 31px; color: var(--ivory-dim); }
  .close .acts { margin: 56px auto 0; width: 860px; border-top: 1px solid rgba(201,164,92,.3); }
  .close .act {
    display: flex; align-items: center; gap: 26px; text-align: left;
    padding: 24px 6px; border-bottom: 1px solid rgba(201,164,92,.3);
    font-family: 'Cormorant Garamond', serif; font-size: 31px; line-height: 1.25; color: var(--ivory);
  }
  .close .act span { flex: 1; }
  .close .act svg { flex: none; }
  .close .act b { font-weight: 600; color: var(--gold-3); }
  .close .sign {
    position: absolute; bottom: 150px; left: 0; right: 0; text-align: center;
    font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 38px; color: var(--gold-3);
  }
</style>
</head>
<body>
<div id="pano">
  <svg id="smoke" class="layer" xmlns="http://www.w3.org/2000/svg"></svg>
  <svg id="deco" class="layer" xmlns="http://www.w3.org/2000/svg"></svg>
  <div id="slides"></div>
  <svg id="grain" class="layer" xmlns="http://www.w3.org/2000/svg"></svg>
</div>

<script>
const W = 1080, H = 1350, N = 10;
const NS = 'http://www.w3.org/2000/svg';

/* ---------------- Texto ---------------- */
const parts = [
  { n: 'I', k: 'El pelotón',
    p: [
      'En diciembre de 1849, un joven de veintiocho años estuvo frente a un pelotón de fusilamiento en San Petersburgo. Le vendaron los ojos y oyó cargar los fusiles. En el último segundo llegó el indulto del zar: todo había sido un simulacro. Ese hombre era Fiódor Dostoievski. Esa misma noche le escribió a su hermano que la vida es un regalo y que cada minuto podría ser una eternidad de felicidad. No lo escribió después de una vida limpia. Lo escribió con olor a pólvora en la ropa, camino a cuatro años de trabajos forzados en Siberia.',
      'Hoy cumplo cuarenta y cuatro años. Nadie me puso frente a un pelotón, pero yo también sé lo que es sentir que se me acababa el tiempo.'
    ],
    punch: 'Y que no se me acabó.' },
  { n: 'II', k: 'La luz de Iván Ilich',
    p: [
      'No voy a mentirme en este día. Mi vida tiene más tachaduras que renglones limpios. Hubo decisiones tomadas por egoísmo. Hubo irresponsabilidades que pagaron otros. Hubo caídas tan duras que el golpe todavía resuena. Algunas heridas cerraron y dejaron cicatriz. Otras siguen abiertas y duelen cuando cambia el clima del alma.',
      'Tolstói escribió sobre Iván Ilich, un hombre que en su lecho de muerte se pregunta con horror si toda su vida estuvo equivocada. Lo que casi nadie recuerda es cómo termina la historia. En el último instante, cuando deja de defender su vida y siente compasión por los que ama, el miedo se disuelve y aparece la luz. No hubo tiempo para arreglar nada. Bastó con ver con verdad. Eso fue suficiente.'
    ],
    punch: 'Tengo algo que Iván Ilich no tuvo: todavía tengo tiempo.' },
  { n: 'III', k: 'Ante la puerta',
    p: [
      'Kafka no era ruso, pero habitó el mismo sótano del alma. Imaginó a un hombre que despierta convertido en insecto y lo primero que le preocupa es llegar tarde al trabajo. Así se siente la culpa cuando uno la carga demasiado tiempo: como despertar dentro de un cuerpo que ya no reconoces y seguir fingiendo que todo está en orden.',
      'Kafka también dejó una parábola. Un hombre pasa la vida entera esperando frente a una puerta, sin atreverse a cruzarla. Al morir le dicen que esa puerta existía solo para él. No quiero que ese sea mi final.'
    ],
    punch: 'No quiero morir frente a la puerta de mi propia redención, esperando un permiso que nadie más que yo puede darme.' },
  { n: 'IV', k: 'Ni una sola hoja',
    p: [
      'Hay una canción que dice que no arrancaría ni una sola hoja del libro que ha vivido. Al principio me pareció soberbia. Ahora creo que es lo más honesto que se puede decir.',
      'Si arranco las páginas de mis errores, también se van las páginas donde aprendí a pedir perdón. Se van las noches en que entendí lo que valía lo que perdí y las caídas que me enseñaron a reconocer a quienes me levantaron. Dostoievski lo sabía. Raskólnikov no se salva a pesar de su crimen, sino a través de lo que el crimen le obliga a ver. Su resurrección empieza en Siberia, al lado de Sonia, en el lugar más bajo de su historia.'
    ],
    punch: 'Mis páginas oscuras no son la negación de mi libro. Son la tinta con la que todavía puedo escribir algo verdadero.' },
  { n: 'V', k: 'Gota a gota',
    p: [
      'Chéjov le escribió a un amigo que había pasado la vida sacándose al esclavo de adentro, gota a gota, hasta que un día despertó sintiendo que por sus venas corría sangre de hombre libre. No fue una conversión repentina ni un milagro. Fue una disciplina lenta, diaria, casi aburrida.',
      'Así quiero vivir los años que me quedan. No espero redimirme de golpe en una gran escena. Quiero sacar gota a gota al hombre egoísta, al irresponsable, al que huía.'
    ],
    punch: 'Cada día un poco. Cada hoy.' },
  { n: 'VI', k: 'La línea',
    p: [
      'Solzhenitsyn pasó años en el Gulag. Allí entendió que la línea entre el bien y el mal no divide a los buenos de los malos. Atraviesa cada corazón humano. También atraviesa el mío.',
      'Eso me libera de dos mentiras al mismo tiempo. No soy un monstruo irredimible, ni tampoco soy inocente. Soy un hombre dividido, como todos, y la batalla se sigue librando.'
    ],
    punch: 'Mientras se libre, no está perdida.' },
  { n: 'VII', k: 'La llave',
    p: [
      'El stárets Zósima, en <em>Los hermanos Karamázov</em>, enseñaba que cada uno es responsable ante todos y por todo. Parece una condena. Él lo decía como una llave: si soy responsable, también soy capaz. Si mis actos hirieron, mis actos también pueden sanar.'
    ],
    punch: 'No podré reparar todo lo que rompí, pero sí puedo dejar de romper y empezar a construir.' },
  { n: 'VIII', k: 'La pluma',
    p: [
      'No sé cuántas páginas me quedan en este libro. Nadie lo sabe. Dostoievski tampoco lo sabía frente al pelotón, y sin embargo vivió treinta y dos años más y escribió sus mejores obras después de su peor momento.',
      'Hoy no celebro lo que he sido. Celebro que todavía puedo llegar a ser.'
    ],
    punch: 'Cuarenta y cuatro años. El libro sigue abierto. La pluma sigue en mi mano.' },
];

/* ---------------- Utilidades ---------------- */
let seed = 44;
const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const el = (tag, attrs = {}, parent) => {
  const e = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
  if (parent) parent.appendChild(e);
  return e;
};
const svgStr = (w, h, inner, vb) =>
  `<svg xmlns="${NS}" width="${w}" height="${h}" viewBox="${vb || `0 0 ${w} ${h}`}" fill="none">${inner}</svg>`;

// Glifo de Libra dibujado (sin depender de fuentes/emoji)
const libraPath = (x, y, s) => {
  const u = s / 100;
  const X = v => (x + v * u).toFixed(2), Y = v => (y + v * u).toFixed(2);
  return `M${X(8)} ${Y(84)} H${X(92)} M${X(8)} ${Y(64)} H${X(33)} A${(22*u).toFixed(2)} ${(22*u).toFixed(2)} 0 1 1 ${X(67)} ${Y(64)} H${X(92)}`;
};
const libraSvg = (s, color = '#c9a45c', sw = 7) =>
  svgStr(s, s, `<path d="${libraPath(0, 0, 100)}" stroke="${color}" stroke-width="${sw}" stroke-linecap="round"/>`, '0 0 100 100');

// Fase lunar (f = 0..1 iluminada)
const moonSvg = (s, f) => {
  const r = 44, c = 50;
  let lit = '';
  if (f >= 0.999) lit = `<circle cx="${c}" cy="${c}" r="${r}" fill="#e9d08f"/>`;
  else if (f > 0.001) {
    const rx = Math.abs(1 - 2 * f) * r;
    lit = `<path d="M${c} ${c - r} A${r} ${r} 0 0 1 ${c} ${c + r} A${rx} ${r} 0 0 ${f < .5 ? 0 : 1} ${c} ${c - r}Z" fill="#e9d08f"/>`;
  }
  return svgStr(s, s, `<circle cx="50" cy="50" r="${r}" stroke="#c9a45c" stroke-width="5"/>${lit}`, '0 0 100 100');
};

// Ornamento bajo el numeral
const ornament = () => svgStr(360, 30, `
  <defs><linearGradient id="og" x1="0" x2="1"><stop offset="0" stop-color="#c9a45c" stop-opacity="0"/><stop offset=".5" stop-color="#e9d08f"/><stop offset="1" stop-color="#c9a45c" stop-opacity="0"/></linearGradient></defs>
  <path d="M0 15 H150 M210 15 H360" stroke="url(#og)" stroke-width="1.4"/>
  <path d="M180 3 L192 15 L180 27 L168 15 Z" stroke="#e9d08f" stroke-width="1.4"/>
  <circle cx="180" cy="15" r="2.6" fill="#e9d08f"/>
  <circle cx="158" cy="15" r="1.8" fill="#c9a45c"/><circle cx="202" cy="15" r="1.8" fill="#c9a45c"/>`);

const arrow = () => svgStr(54, 14, `<path d="M0 7 H50 M43 1 L51 7 L43 13" stroke="#c9a45c" stroke-width="1.6"/>`);

/* ---------------- Círculo ritual (sigilo) ---------------- */
function sigil(g, cx, cy, R, opts = {}) {
  const stroke = opts.color || '#c9a45c';
  const gg = el('g', { transform: `translate(${cx} ${cy}) rotate(${opts.rot || 0})`, stroke, fill: 'none', opacity: opts.opacity ?? 1 }, g);
  const sw = opts.sw || 1.2;
  el('circle', { r: R, 'stroke-width': sw }, gg);
  el('circle', { r: R * .965, 'stroke-width': sw * .6 }, gg);
  // marcas de grados
  for (let i = 0; i < 360; i += 2) {
    const a = i * Math.PI / 180, long = i % 30 === 0, mid = i % 10 === 0;
    const r1 = R * .965, r2 = R * (long ? .915 : mid ? .935 : .95);
    el('line', { x1: r1 * Math.cos(a), y1: r1 * Math.sin(a), x2: r2 * Math.cos(a), y2: r2 * Math.sin(a), 'stroke-width': sw * (long ? .9 : .5) }, gg);
  }
  // inscripción
  if (opts.text) {
    const id = 'tp' + Math.round(cx) + '_' + Math.round(cy);
    const rr = R * .845;
    el('path', { id, d: `M ${-rr} 0 A ${rr} ${rr} 0 1 1 ${rr} 0 A ${rr} ${rr} 0 1 1 ${-rr} 0`, stroke: 'none' }, gg);
    const t = el('text', { fill: stroke, stroke: 'none', 'font-family': 'Cinzel', 'font-size': R * .062, 'letter-spacing': R * .022 }, gg);
    const tp = el('textPath', { href: '#' + id, textLength: (2 * Math.PI * rr - R * .02).toFixed(1), lengthAdjust: 'spacing' }, t);
    tp.textContent = opts.text;
  }
  el('circle', { r: R * .79, 'stroke-width': sw * .8 }, gg);
  // octagrama {8/3}: ocho partes
  const r8 = R * .79, pts = [];
  for (let i = 0; i < 8; i++) { const a = (i * 45 - 90) * Math.PI / 180; pts.push([r8 * Math.cos(a), r8 * Math.sin(a)]); }
  let d = '';
  for (let i = 0; i < 8; i++) { const p = pts[(i * 3) % 8]; d += (i ? 'L' : 'M') + p[0].toFixed(2) + ' ' + p[1].toFixed(2); }
  el('path', { d: d + 'Z', 'stroke-width': sw * .7 }, gg);
  // cuadrados superpuestos
  for (const rot of [0, 45]) {
    const s = R * .79 * Math.SQRT1_2;
    el('rect', { x: -s, y: -s, width: 2 * s, height: 2 * s, transform: `rotate(${rot})`, 'stroke-width': sw * .45 }, gg);
  }
  el('circle', { r: R * .3, 'stroke-width': sw * .8 }, gg);
  el('circle', { r: R * .27, 'stroke-width': sw * .4 }, gg);
  // pequeñas lunas/nodos en los vértices
  pts.forEach(([x, y], i) => {
    el('circle', { cx: x, cy: y, r: R * .028, 'stroke-width': sw * .7, fill: i % 2 ? 'none' : stroke }, gg);
  });
  // triángulos alquímicos (aire: triángulo con barra — elemento de Libra)
  const ta = R * .12;
  [[0, -R * .55], [0, R * .55], [-R * .55, 0], [R * .55, 0]].forEach(([x, y], i) => {
    const up = i % 2 === 0;
    const h = ta * .9 * (up ? 1 : -1);
    el('path', { d: `M${x} ${y - h} L${x + ta} ${y + h * .8} L${x - ta} ${y + h * .8} Z M${x - ta * .75} ${y + h * .12} H${x + ta * .75}`, 'stroke-width': sw * .7 }, gg);
  });
  // centro: Libra
  if (opts.center !== false) {
    const s = R * .34;
    el('path', { d: libraPath(-s / 2, -s / 2 - s * .1, s), 'stroke-width': sw * 2.2, 'stroke-linecap': 'round', transform: `rotate(${-(opts.rot || 0)})` }, gg);
  }
  return gg;
}

/* ---------------- Balanza (portada) ---------------- */
function scales(g, cx, cy, s, color) {
  const gg = el('g', { transform: `translate(${cx} ${cy})`, stroke: color, fill: 'none', 'stroke-width': 2.2, 'stroke-linecap': 'round' }, g);
  el('path', { d: `M0 ${-s * .62} V${s * .5} M${-s * .2} ${s * .5} H${s * .2} M${-s * .12} ${s * .44} H${s * .12}` }, gg);
  el('circle', { cx: 0, cy: -s * .66, r: s * .035 }, gg);
  el('path', { d: `M${-s * .5} ${-s * .5} Q0 ${-s * .6} ${s * .5} ${-s * .5}` }, gg);
  for (const sx of [-1, 1]) {
    const x = sx * s * .5, y = -s * .5;
    el('path', { d: `M${x} ${y} L${x - s * .17} ${y + s * .42} M${x} ${y} L${x + s * .17} ${y + s * .42}`, 'stroke-width': 1.3 }, gg);
    el('path', { d: `M${x - s * .2} ${y + s * .42} Q${x} ${y + s * .58} ${x + s * .2} ${y + s * .42} Z` }, gg);
  }
  return gg;
}

/* ---------------- Capas de fondo ---------------- */
function buildSmoke() {
  const svg = document.getElementById('smoke');
  svg.setAttribute('width', W * N); svg.setAttribute('height', H);
  const defs = el('defs', {}, svg);
  const mk = (id, bf, oct, sd, rgb, a) => {
    const f = el('filter', { id, x: 0, y: 0, width: '100%', height: '100%', 'color-interpolation-filters': 'sRGB' }, defs);
    el('feTurbulence', { type: 'fractalNoise', baseFrequency: bf, numOctaves: oct, seed: sd, result: 'n' }, f);
    el('feColorMatrix', { in: 'n', type: 'matrix',
      values: `0 0 0 0 ${rgb[0]}  0 0 0 0 ${rgb[1]}  0 0 0 0 ${rgb[2]}  ${a[0]} ${a[1]} 0 0 ${a[2]}` }, f);
  };
  mk('sm1', '0.0016 0.0042', 5, 7, [0.86, 0.80, 0.72], [2.6, -1.2, -0.95]);
  mk('sm2', '0.003 0.0075', 4, 19, [0.72, 0.42, 0.50], [2.4, -1.0, -0.98]);
  mk('sm3', '0.0009 0.0026', 3, 3, [0.80, 0.64, 0.38], [2.2, -1.1, -0.92]);
  // máscaras: el humo sube desde abajo y se adelgaza arriba
  const lg = el('linearGradient', { id: 'fadeV', x1: 0, y1: 1, x2: 0, y2: 0 }, defs);
  el('stop', { offset: 0, 'stop-color': '#fff', 'stop-opacity': 1 }, lg);
  el('stop', { offset: .55, 'stop-color': '#fff', 'stop-opacity': .55 }, lg);
  el('stop', { offset: 1, 'stop-color': '#fff', 'stop-opacity': .25 }, lg);
  const m = el('mask', { id: 'mv' }, defs);
  el('rect', { width: W * N, height: H, fill: 'url(#fadeV)' }, m);
  const g = el('g', { mask: 'url(#mv)' }, svg);
  el('rect', { width: W * N, height: H, filter: 'url(#sm3)', opacity: .55 }, g);
  el('rect', { width: W * N, height: H, filter: 'url(#sm1)', opacity: .42 }, g);
  el('rect', { width: W * N, height: H, filter: 'url(#sm2)', opacity: .38 }, g);
}

function buildGrain() {
  const svg = document.getElementById('grain');
  svg.setAttribute('width', W * N); svg.setAttribute('height', H);
  const f = el('filter', { id: 'gr' }, el('defs', {}, svg));
  el('feTurbulence', { type: 'fractalNoise', baseFrequency: .9, numOctaves: 2, seed: 4 }, f);
  el('feColorMatrix', { type: 'saturate', values: 0 }, f);
  el('rect', { width: W * N, height: H, filter: 'url(#gr)' }, svg);
}

function buildDeco() {
  const svg = document.getElementById('deco');
  svg.setAttribute('width', W * N); svg.setAttribute('height', H);
  const defs = el('defs', {}, svg);
  const rg = el('radialGradient', { id: 'glow' }, defs);
  el('stop', { offset: 0, 'stop-color': '#e9c77d', 'stop-opacity': .32 }, rg);
  el('stop', { offset: .4, 'stop-color': '#c9a45c', 'stop-opacity': .08 }, rg);
  el('stop', { offset: 1, 'stop-color': '#c9a45c', 'stop-opacity': 0 }, rg);
  const thread = el('linearGradient', { id: 'thr', x1: 0, x2: 1 }, defs);
  el('stop', { offset: 0, 'stop-color': '#c9a45c', 'stop-opacity': .0 }, thread);
  el('stop', { offset: .03, 'stop-color': '#c9a45c', 'stop-opacity': .7 }, thread);
  el('stop', { offset: .97, 'stop-color': '#c9a45c', 'stop-opacity': .7 }, thread);
  el('stop', { offset: 1, 'stop-color': '#c9a45c', 'stop-opacity': 0 }, thread);

  // polvo de estrellas
  const stars = el('g', { fill: '#f1dca2' }, svg);
  for (let i = 0; i < 900; i++) {
    const x = rnd() * W * N, y = rnd() * H, r = rnd() < .93 ? rnd() * 1.1 + .3 : rnd() * 1.6 + 1.2;
    el('circle', { cx: x, cy: y, r, opacity: (rnd() * .35 + .08).toFixed(2) }, stars);
  }
  // destellos de cuatro puntas
  for (let i = 0; i < 46; i++) {
    const x = rnd() * W * N, y = rnd() * H, s = rnd() * 9 + 5;
    el('path', { d: `M${x} ${y - s} Q${x} ${y} ${x + s * .28} ${y} Q${x} ${y} ${x} ${y + s} Q${x} ${y} ${x - s * .28} ${y} Q${x} ${y} ${x} ${y - s}Z`,
      fill: '#f1dca2', opacity: (rnd() * .5 + .35).toFixed(2) }, svg);
  }

  // Sigilos que cruzan las costuras entre láminas: invitan a deslizar
  const seams = [
    [1 * W, 1180, 470, 12],
    [2 * W, 150, 330, -8],
    [3 * W, 1240, 420, 20],
    [4 * W, 120, 380, 4],
    [5 * W, 1200, 450, -14],
    [6 * W, 170, 340, 30],
    [7 * W, 1230, 430, 0],
    [8 * W, 140, 360, -22],
    [9 * W, 1190, 470, 16],
  ];
  const txt = 'MEMENTO VIVERE · AEQVILIBRIVM · LIBER APERTVS · XLIV · ';
  seams.forEach(([x, y, r, rot], i) => {
    el('circle', { cx: x, cy: y, r: r * 1.15, fill: 'url(#glow)', opacity: .5 }, svg);
    sigil(svg, x, y, r, { rot, opacity: .15, sw: 1.3, text: txt.repeat(2), center: true });
  });

  // Hilo dorado continuo — el fiel de la balanza a lo largo de todo el carrusel
  const ty = H - 128;
  el('line', { x1: 0, y1: ty, x2: W * N, y2: ty, stroke: 'url(#thr)', 'stroke-width': 1 }, svg);
  for (let i = 1; i < N; i++) {
    const x = i * W;
    el('path', { d: `M${x} ${ty - 7} L${x + 7} ${ty} L${x} ${ty + 7} L${x - 7} ${ty} Z`, fill: '#07060a', stroke: '#c9a45c', 'stroke-width': 1.2 }, svg);
  }
}

/* ---------------- Láminas ---------------- */
function buildSlides() {
  const host = document.getElementById('slides');
  const total = parts.length;

  // 0 · Portada
  const cover = document.createElement('section');
  cover.className = 'slide cover';
  cover.style.left = '0px';
  cover.innerHTML = `
    <div class="vignette"></div>
    <div class="hdr"><div class="l">${libraSvg(26)}<span>XLIV</span></div><div class="r"><span>LIBRA</span>${moonSvg(22, 0)}</div></div>
    <div class="date">2 · X · MMXXVI</div>
    <svg class="sigil" width="520" height="520" viewBox="0 0 520 520" id="coverSigil"></svg>
    <div class="big">
      <h1>El libro sigue <b>abierto</b></h1>
      <p class="sub">Cumplo 44 con más tachaduras que renglones limpios. Esto es lo que Dostoievski, Tolstói, Kafka, Chéjov y Solzhenitsyn me enseñaron sobre <em>la culpa, el tiempo y la redención.</em></p>
    </div>
    <div class="names">OCHO PÁGINAS · UN SOLO LIBRO</div>
    <div class="ftr"><span>I — VIII</span><span class="swipe">LEE HASTA EL FINAL ${arrow()}</span></div>`;
  host.appendChild(cover);
  const cs = cover.querySelector('#coverSigil');
  el('circle', { cx: 260, cy: 260, r: 250, fill: 'url(#glow)' }, cs);
  const defs = el('defs', {}, cs);
  const rg = el('radialGradient', { id: 'glow' }, defs);
  el('stop', { offset: 0, 'stop-color': '#e9c77d', 'stop-opacity': .35 }, rg);
  el('stop', { offset: .5, 'stop-color': '#c9a45c', 'stop-opacity': .06 }, rg);
  el('stop', { offset: 1, 'stop-color': '#c9a45c', 'stop-opacity': 0 }, rg);
  sigil(cs, 260, 260, 245, { rot: 0, opacity: .85, sw: 1.4, text: 'MEMENTO VIVERE · AEQVILIBRIVM · LIBER APERTVS · XLIV · '.repeat(2), center: false });
  scales(cs, 260, 272, 150, '#f1dca2');

  // 1..8 · Partes
  parts.forEach((pt, i) => {
    const s = document.createElement('section');
    s.className = 'slide part';
    s.style.left = ((i + 1) * W) + 'px';
    const last = i === total - 1;
    s.innerHTML = `
      <div class="vignette"></div>
      <div class="hdr">
        <div class="l">${libraSvg(26)}<span>XLIV</span></div>
        <div class="r"><span>${pt.n} · VIII</span>${moonSvg(22, (i + 1) / total)}</div>
      </div>
      <div class="head">
        <div class="numeral">${pt.n}</div>
        ${ornament()}
        <div class="kicker">${pt.k}</div>
      </div>
      <div class="body">
        ${pt.p.map(t => `<p>${t}</p>`).join('')}
        <p class="punch">${pt.punch}</p>
      </div>
      <div class="ftr">
        <span>${last ? 'MEMENTO VIVERE' : 'EL LIBRO SIGUE'}</span>
        <span class="swipe">${last ? 'UNA ÚLTIMA PÁGINA' : 'DESLIZA'} ${arrow()}</span>
      </div>`;
    host.appendChild(s);
  });

  // 9 · Cierre / interacción
  const close = document.createElement('section');
  close.className = 'slide close';
  close.style.left = (9 * W) + 'px';
  const ic = {
    comment: svgStr(40, 40, `<path d="M6 8 H34 V27 H17 L9 34 V27 H6 Z" stroke="#c9a45c" stroke-width="1.8" stroke-linejoin="round"/>`),
    save: svgStr(40, 40, `<path d="M10 5 H30 V35 L20 27 L10 35 Z" stroke="#c9a45c" stroke-width="1.8" stroke-linejoin="round"/>`),
    send: svgStr(40, 40, `<path d="M4 18 L36 5 L26 36 L19 22 Z M19 22 L36 5" stroke="#c9a45c" stroke-width="1.8" stroke-linejoin="round"/>`),
  };
  close.innerHTML = `
    <div class="vignette"></div>
    <div class="hdr"><div class="l">${libraSvg(26)}<span>XLIV</span></div><div class="r"><span>TU PÁGINA</span>${moonSvg(22, 1)}</div></div>
    <div class="wrap">
      <div class="eyebrow">AHORA TÚ</div>
      <h2>Si pudieras arrancar<br>una sola página de tu libro,<br><em>¿lo harías?</em></h2>
      <div class="choice">
        <div class="pill"><div class="w">ARRANCO</div><div class="d">hay una que pesa demasiado</div></div>
        <div class="pill"><div class="w">CONSERVO</div><div class="d">todas me trajeron hasta aquí</div></div>
      </div>
      <div class="how">Respóndeme con una sola palabra en comentarios.</div>
      <div class="acts">
        <div class="act">${ic.save}<span><b>Guárdalo</b> para el día en que sientas que se te acaba el&nbsp;tiempo.</span></div>
        <div class="act">${ic.send}<span><b>Envíaselo</b> a quien sigue esperando frente a su&nbsp;puerta.</span></div>
      </div>
    </div>
    <div class="sign">La pluma sigue en mi mano.</div>
    <div class="ftr"><span>XLIV · LIBRA</span><span class="swipe">MEMENTO VIVERE</span></div>`;
  host.appendChild(close);
}

/* Ajuste del cuerpo de texto para que siempre quepa con holgura */
function fitBodies() {
  document.querySelectorAll('.body').forEach(b => {
    let fs = 37;
    b.style.fontSize = fs + 'px';
    const fits = () => b.lastElementChild.getBoundingClientRect().bottom - b.firstElementChild.getBoundingClientRect().top + 40 <= b.clientHeight;
    while (!fits() && fs > 24) { fs -= .5; b.style.fontSize = fs + 'px'; }
    b.dataset.fs = fs;
  });
}

buildSmoke();
buildDeco();
buildGrain();
buildSlides();
document.fonts.ready.then(() => { fitBodies(); document.body.dataset.ready = '1'; });
</script>
</body>
